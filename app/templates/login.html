<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PrüfTurbo Login</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #f5f7fb; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { width: 100%; max-width: 420px; background: white; border-radius: 14px; box-shadow: 0 10px 35px rgba(0,0,0,.12); padding: 32px; }
    h1 { margin: 0 0 8px; font-size: 28px; }
    .sub { color: #5f6b7a; margin-bottom: 24px; }
    label { display: block; margin: 16px 0 6px; font-weight: 600; }
    input { width: 100%; box-sizing: border-box; padding: 12px; border: 1px solid #ccd3dc; border-radius: 8px; font-size: 16px; }
    button { margin-top: 24px; width: 100%; padding: 12px; border: 0; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer; background: #0b5fff; color: white; }
    .error { background: #ffe8e8; color: #9b1c1c; padding: 10px 12px; border-radius: 8px; margin-bottom: 16px; }
    .hint { margin-top: 18px; font-size: 13px; color: #6b7280; }
  </style>
</head>
<body>
  <main class="card">
    <h1>PrüfTurbo</h1>
    <div class="sub">Sign in to access the tool</div>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post" action="/login">
      <input type="hidden" name="next" value="{{ next }}" />
      <label for="username">Email or username</label>
      <input id="username" name="username" type="text" autocomplete="username" required autofocus />
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />
      <button type="submit">Login</button>
    </form>
    <div class="hint">Access is restricted. Contact the PrüfTurbo administrator if you need an account.</div>
  </main>
</body>
</html>
